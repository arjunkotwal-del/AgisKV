name: AegisKV CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  cpp-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build C++20 Engine & Run Native Unit Tests
        run: |
          cmake -S cpp_core -B cpp_core/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp_core/build -j
          ./cpp_core/build/aegis_tests
          ./cpp_core/build/aegis_bench cpp_core/build/bench_results.json
      - name: Install Python Gateway Dependencies & Run Pytest + Evals
        run: |
          pip install -r requirements.txt
          pytest -v
          python -m evals.run_eval

  web-3d-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck and Build 3D Showcase
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
