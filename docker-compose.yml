services:
  aegiskv:
    build: .
    ports:
      - "8000:8000"
    environment:
      - AEGIS_EMBED_PROVIDER=local-hybrid
      - AEGIS_PRIMARY_MODEL=gpt-4o
      - AEGIS_FALLBACK_MODEL=gpt-4o-mini
    volumes:
      - aegis_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  aegis_data:
